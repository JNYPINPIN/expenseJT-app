<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>รายจ่ายครอบครัว</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hand-drawn SVG filter -->
    <svg style="position:absolute;width:0;height:0">
        <defs>
            <filter id="hand-drawn">
                <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" seed="1" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>
    <div id="theme-bg"></div>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <h1 id="page-title" data-i18n="appTitle">รายจ่ายครอบครัว</h1>
            <div class="top-actions">
                <button class="icon-btn" onclick="showSettingsModal()" aria-label="ตั้งค่า">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="2.5"/><line x1="11" y1="6" x2="21" y2="6"/><line x1="3" y1="6" x2="5" y2="6"/><circle cx="15" cy="12" r="2.5"/><line x1="3" y1="12" x2="13" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/><circle cx="9" cy="18" r="2.5"/><line x1="13" y1="18" x2="21" y2="18"/><line x1="3" y1="18" x2="7" y2="18"/></svg>
                </button>
            </div>
        </header>

        <!-- Month Selector -->
        <div class="month-bar">
            <button class="month-arrow" onclick="changeMonth(-1)" aria-label="เดือนก่อน">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12L15 20"/></svg>
            </button>
            <div class="month-scroll" id="month-scroll"></div>
            <button class="month-arrow" onclick="changeMonth(1)" aria-label="เดือนถัดไป">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L17 12L9 20"/></svg>
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards" id="summary-cards">
            <div class="summary-card total">
                <div class="card-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="26" height="20" rx="4"/>
                        <rect x="4" y="10" width="26" height="7" rx="4"/>
                        <circle cx="24" cy="23" r="2.5"/>
                        <circle cx="33" cy="8" r="5" fill="#FFD54F" stroke="#F9A825" stroke-width="1.2"/>
                        <text x="33" y="10.5" text-anchor="middle" font-size="6" font-weight="bold" fill="#F57F17" stroke="none">฿</text>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-label">รวมทั้งหมด</span>
                    <span class="card-value" id="total-expense">฿0</span>
                </div>
            </div>
            <div class="summary-card my-share">
                <div class="card-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="#4CAF50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="20" cy="13" r="6"/>
                        <path d="M8 34C8 26 13 22 20 22C27 22 32 26 32 34"/>
                        <circle cx="30" cy="10" r="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.2"/>
                        <text x="30" y="12.5" text-anchor="middle" font-size="5" font-weight="bold" fill="#4CAF50" stroke="none">฿</text>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-label">รายจ่ายของฉัน</span>
                    <span class="card-value" id="my-share">฿0</span>
                </div>
            </div>
            <div class="summary-card collect">
                <div class="card-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="#FF9800" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 24C6 24 10 20 16 20C22 20 22 24 28 24C31 24 33 22 36 21"/>
                        <path d="M6 24V32H36V21"/>
                        <circle cx="20" cy="12" r="6"/>
                        <text x="20" y="14.5" text-anchor="middle" font-size="7" font-weight="bold" fill="#FF9800" stroke="none">฿</text>
                        <path d="M14 6L16 3L18 6" stroke="#FFB74D" stroke-width="1.2"/>
                        <path d="M24 5L25 2L26 5" stroke="#FFB74D" stroke-width="1.2"/>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-label" id="collect-label">เรียกเก็บ</span>
                    <span class="card-value" id="collect-amount">฿0</span>
                </div>
            </div>
        </div>

        <!-- Payment Channel Summary -->
        <div class="channel-summary" id="channel-summary"></div>

        <!-- Credit Card Summary -->
        <div class="credit-card-summary" id="credit-card-summary"></div>

        <!-- Expense List -->
        <div class="expense-list" id="expense-list"></div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="expenses" onclick="switchTab('expenses')">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2C5 2 4 3 4 4V21L6.5 19.5L8.5 21L10.5 19.5L12 21L13.5 19.5L15.5 21L17.5 19.5L20 21V4C20 3 19 2 18 2Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
                <span>รายจ่าย</span>
            </button>
            <button class="nav-btn" data-tab="installments" onclick="switchTab('installments')">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><circle cx="12" cy="14" r="2" fill="currentColor" stroke="none"/></svg>
                <span>ผ่อนชำระ</span>
            </button>
            <button class="nav-btn add-btn" onclick="showAddExpense()">
                <svg class="nav-svg-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="11" x2="13" y2="11"/><path d="M15 14L18 11L20 13L17 16Z"/><line x1="15" y1="14" x2="18" y2="11"/></svg>
            </button>
            <button class="nav-btn" data-tab="summary" onclick="switchTab('summary')">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V12Q3 10 5 10H7Q9 10 9 12V20"/><path d="M9 20V7Q9 5 11 5H13Q15 5 15 7V20"/><path d="M15 20V10Q15 8 17 8H19Q21 8 21 10V20"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
                <span>สรุป</span>
            </button>
            <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20"/></svg>
                <span>ข้อมูลของฉัน</span>
            </button>
        </nav>

        <!-- Add/Edit Expense Modal -->
        <div class="modal" id="expense-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">เพิ่มรายจ่าย</h2>
                    <button class="icon-btn" onclick="closeModal('expense-modal')" aria-label="ปิด"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
                </div>
                <form id="expense-form" onsubmit="saveExpense(event)">
                    <div class="form-group">
                        <label>รายการ</label>
                        <input type="text" id="exp-name" placeholder="ชื่อรายการ" required autocomplete="off" list="item-suggestions">
                        <datalist id="item-suggestions"></datalist>
                    </div>
                    <div class="form-group">
                        <label>จำนวนเงิน (บาท)</label>
                        <input type="number" id="exp-amount" placeholder="0" required min="0" step="0.01" inputmode="decimal">
                    </div>
                    <div class="form-group">
                        <label>ช่องทางจ่าย</label>
                        <select id="exp-channel">
                            <option value="cash">เงินสด</option>
                            <option value="credit">บัตรเครดิต</option>
                            <option value="shopee">Shopee</option>
                        </select>
                    </div>
                    <div class="form-group" id="credit-card-group" style="display:none">
                        <label>บัตรเครดิต</label>
                        <select id="exp-credit-card"></select>
                    </div>
                    <div class="form-group">
                        <label>ร้านค้า / แหล่งซื้อ</label>
                        <select id="exp-shop">
                            <option value="">-- เลือกร้านค้า --</option>
                        </select>
                    </div>
                    <div class="form-group" id="custom-shop-group" style="display:none">
                        <label>ชื่อร้านค้า (อื่นๆ)</label>
                        <input type="text" id="exp-shop-custom" placeholder="พิมพ์ชื่อร้านค้า" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>วันที่</label>
                        <input type="date" id="exp-date">
                    </div>

                    <div class="form-divider">
                        <span>การผ่อนชำระ</span>
                    </div>
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>ผ่อน (เดือน)</label>
                            <input type="number" id="exp-installments" placeholder="1" min="1" value="1" inputmode="numeric">
                        </div>
                    </div>
                    <div class="installment-preview" id="installment-preview" style="display:none">
                        <p>ผ่อนเดือนละ: <strong id="installment-per-month">฿0</strong></p>
                        <p>ตั้งแต่: <span id="installment-range"></span></p>
                    </div>

                    <div class="form-divider">
                        <span>หารค่าใช้จ่าย</span>
                    </div>
                    <div class="form-group">
                        <label>เลือกคนที่หารด้วย</label>
                        <div class="member-picker" id="member-picker"></div>
                    </div>
                    <div class="split-preview" id="split-preview">
                        <p>คนละ: <strong id="split-per-person">฿0</strong></p>
                    </div>
                    <div class="split-detail" id="split-detail"></div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="exp-shared" checked>
                            แชร์ให้ครอบครัวทราบ
                        </label>
                    </div>

                    <input type="hidden" id="exp-id">
                    <button type="submit" class="btn-primary" id="save-btn">บันทึก</button>
                    <button type="button" class="btn-danger" id="delete-btn" style="display:none" onclick="deleteExpense()">ลบรายการ</button>
                </form>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>ตั้งค่า</h2>
                    <button class="icon-btn" onclick="closeModal('settings-modal')" aria-label="ปิด"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
                </div>
                <div class="settings-section">
                    <h3>👥 สมาชิกครอบครัว</h3>
                    <div id="family-members-list"></div>
                    <div class="form-row">
                        <input type="text" id="new-member-name" placeholder="ชื่อสมาชิก" class="flex-1">
                        <button class="btn-small" onclick="addFamilyMember()">+</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>💳 บัตรเครดิต</h3>
                    <div id="credit-cards-list"></div>
                    <div class="form-row">
                        <input type="text" id="new-card-name" placeholder="ชื่อบัตร เช่น KTC, SCB" class="flex-1">
                        <input type="text" id="new-card-last4" placeholder="4 ตัวท้าย" class="card-last4" maxlength="4">
                        <button class="btn-small" onclick="addCreditCard()">+</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>🏪 ร้านค้าที่ใช้บ่อย</h3>
                    <div id="shops-list"></div>
                    <div class="form-row">
                        <input type="text" id="new-shop-name" placeholder="ชื่อร้านค้า" class="flex-1">
                        <button class="btn-small" onclick="addShop()">+</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>💾 ข้อมูล</h3>
                    <button class="btn-secondary" onclick="exportData()">📥 ส่งออกข้อมูล</button>
                    <button class="btn-secondary" onclick="document.getElementById('import-file').click()">📤 นำเข้าข้อมูล</button>
                    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
                    <button class="btn-danger" onclick="confirmClearData()">🗑️ ล้างข้อมูลทั้งหมด</button>
                </div>
            </div>
        </div>

        <!-- Share Modal -->
        <div class="modal" id="share-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>แชร์รายจ่าย</h2>
                    <button class="icon-btn" onclick="closeModal('share-modal')" aria-label="ปิด"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
                </div>
                <div id="share-content"></div>
            </div>
        </div>

        <!-- Settings Modal (⚙️) -->
        <div class="modal" id="app-settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 data-i18n="settingsTitle">ตั้งค่า</h2>
                    <button class="icon-btn" onclick="closeModal('app-settings-modal')"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
                </div>
                <div id="app-settings-body"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('SW registered');
        }).catch(function(err) {
            console.log('SW error:', err);
        });
    }
    </script>
</body>
</html>
